<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0275ff"/>
      <stop offset="50%" stop-color="#015fc9"/>
      <stop offset="100%" stop-color="#003578"/>
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Headlight Glow -->
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Bumper & Chrome -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001838" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Icon Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Bus Outer Body / Silhouette with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Side Mirrors -->
    <rect x="74" y="210" width="18" height="54" rx="9" fill="#ffffff" opacity="0.95"/>
    <rect x="70" y="222" width="20" height="8" rx="4" fill="#cbd5e1"/>
    
    <rect x="420" y="210" width="18" height="54" rx="9" fill="#ffffff" opacity="0.95"/>
    <rect x="422" y="222" width="20" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Main Bus Chassis -->
    <rect x="96" y="88" width="320" height="340" rx="44" fill="#ffffff"/>
    
    <!-- Top Destination Board (GSRTC Accent) -->
    <rect x="144" y="112" width="224" height="42" rx="10" fill="#015fc9"/>
    <text x="256" y="141" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">GSRTC</text>

    <!-- Large Panoramic Windshield Glass -->
    <rect x="122" y="168" width="268" height="136" rx="20" fill="url(#windshieldGrad)"/>
    
    <!-- Windshield Divider & Wiper Accent -->
    <line x1="256" y1="168" x2="256" y2="304" stroke="#0284c7" stroke-width="4" opacity="0.4"/>
    <path d="M160 286 L200 250" stroke="#0369a1" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M294 286 L334 250" stroke="#0369a1" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Glass Light Sheen / Reflection -->
    <polygon points="128,172 170,172 144,300 128,300" fill="#ffffff" opacity="0.35"/>

    <!-- Lower Grill & Front Body Plate -->
    <rect x="122" y="322" width="268" height="82" rx="16" fill="#f1f5f9"/>

    <!-- Dual Modern Headlights (Left & Right) -->
    <circle cx="156" cy="350" r="18" fill="url(#lightGlow)"/>
    <circle cx="156" cy="350" r="11" fill="#ffffff"/>

    <circle cx="356" cy="350" r="18" fill="url(#lightGlow)"/>
    <circle cx="356" cy="350" r="11" fill="#ffffff"/>

    <!-- Front Center Air Vent / Radiator Slits -->
    <rect x="200" y="340" width="112" height="6" rx="3" fill="#94a3b8"/>
    <rect x="200" y="352" width="112" height="6" rx="3" fill="#94a3b8"/>
    <rect x="200" y="364" width="112" height="6" rx="3" fill="#94a3b8"/>

    <!-- Heavy Duty Chrome Bumper -->
    <rect x="136" y="388" width="240" height="24" rx="8" fill="url(#chromeGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="166" cy="400" r="4" fill="#64748b"/>
    <circle cx="346" cy="400" r="4" fill="#64748b"/>

    <!-- Wheels (Visible Ground Stance) -->
    <rect x="122" y="420" width="48" height="16" rx="6" fill="#0f172a"/>
    <rect x="342" y="420" width="48" height="16" rx="6" fill="#0f172a"/>
  </g>
</svg>
